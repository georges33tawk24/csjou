name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publish the page to the gh-pages branch

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./fetch-sources.sh
      - name: Build
        run: |
          if ! docker build --progress=plain --target web --output type=local,dest=page . > build.log 2>&1; then
            # job logs need repo admin rights; annotations are public, so surface the errors there
            { grep -E 'error( TS[0-9]+)?:|Error [0-9]|CMake Error|undefined reference|fatal|No such file' build.log | grep -v 'Looking for' | head -n 8
              tail -n 1 build.log; } | tr -d '\r' | cut -c1-900 \
              | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          fi
      - name: Publish to GitHub Pages
        # One fresh commit each time keeps the branch small. A fixed address
        # matters: browsers keep the game files per site.
        run: |
          test ! -e page/valve.zip
          touch page/.nojekyll
          cd page
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "JOUCS page from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
