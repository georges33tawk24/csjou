<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="/main.ts"></script>
    <title>JOUCS</title>
    <style>
        :root {
            --bg: #0d0f0c;
            --panel: #171a15;
            --line: #2b3027;
            --text: #e9e6dc;
            --muted: #9a9888;
            --accent: #f2a33a;
            --accent-ink: #1b1305;
            --danger: #ff6b5b;
            --ok: #8fd17a;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            background: radial-gradient(1200px 600px at 70% -10%, #2a2416 0%, transparent 60%), var(--bg);
            color: var(--text);
            font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        /* ---------- homepage ---------- */
        #home {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 16px 24px;
            gap: 28px;
        }

        .brand { text-align: center; }

        .brand h1 {
            margin: 0;
            font-size: clamp(56px, 12vw, 96px);
            line-height: 1;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: var(--accent);
            text-shadow: 0 2px 0 #7a4c10, 0 10px 30px rgba(242, 163, 58, 0.25);
        }

        .brand p { margin: 8px 0 0; color: var(--muted); letter-spacing: 0.04em; }

        .card {
            width: 100%;
            max-width: 460px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }

        input[type=text], input[type=password], select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #0f110e;
            color: var(--text);
            font: inherit;
        }

        input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #0f110e; border-radius: 10px; padding: 4px; gap: 4px; }

        .tabs button {
            padding: 9px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .tabs button[aria-selected=true] { background: var(--line); color: var(--text); }

        .panel { display: flex; flex-direction: column; gap: 14px; }
        .panel[hidden] { display: none; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .range { display: flex; align-items: center; gap: 10px; }
        .range input { flex: 1; accent-color: var(--accent); }
        .range output { min-width: 2ch; text-align: right; font-weight: 700; color: var(--text); }

        .primary {
            padding: 12px;
            border: 0;
            border-radius: 9px;
            background: var(--accent);
            color: var(--accent-ink);
            font: inherit;
            font-weight: 800;
            letter-spacing: 0.03em;
            cursor: pointer;
        }

        .primary:hover { filter: brightness(1.08); }
        .primary:disabled { opacity: 0.5; cursor: progress; }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #0f110e;
            color: var(--muted);
            font-size: 14px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
        .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

        details { border-top: 1px solid var(--line); padding-top: 12px; }
        summary { cursor: pointer; color: var(--muted); font-size: 14px; }
        details .panel { margin-top: 12px; }

        .msg { margin: 0; font-size: 13px; min-height: 1.2em; color: var(--muted); }
        .msg.err { color: var(--danger); }
        .msg.ok { color: var(--ok); }

        .data { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }

        .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
        .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }

        footer { max-width: 460px; text-align: center; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
        footer label { display: inline-flex; gap: 6px; align-items: center; justify-content: center; }

        /* ---------- in game ---------- */
        #game { display: none; }
        body.playing #home { display: none; }
        body.playing #game { display: block; }

        canvas { width: 100vw; height: 100vh; position: fixed; inset: 0; z-index: 1; }

        @keyframes pulsate {
            from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            to { transform: translate(-50%, -50%) scale(0.85); opacity: 0.7; }
        }

        @keyframes fade-out {
            to { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
        }

        #logo {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 2;
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: var(--accent);
            pointer-events: none;
            animation: pulsate 0.75s ease-in-out infinite alternate;
        }

        #logo.done { animation: fade-out 0.5s forwards; }

        #warning {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3;
            margin: 0;
            padding: 12px;
            text-align: center;
            color: var(--danger);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        audio { display: none; }

        @media (prefers-reduced-motion: reduce) {
            #logo { animation: none; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>
<main id="home">
    <div class="brand">
        <h1>JOUCS</h1>
        <p>Counter-Strike 1.6 in your browser</p>
    </div>

    <div class="card">
        <label class="field">Player name
            <input id="username" type="text" maxlength="24" autocomplete="nickname" placeholder="Your name">
        </label>

        <div class="tabs" role="tablist">
            <button id="tabOnline" role="tab" aria-selected="true" aria-controls="online">Online</button>
            <button id="tabOffline" role="tab" aria-selected="false" aria-controls="offline">Offline with bots</button>
        </div>

        <section id="online" class="panel" role="tabpanel">
            <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Checking server…</span></div>
            <button id="join" class="primary">Join server</button>

            <details id="hostBox">
                <summary>Host controls</summary>
                <div class="panel">
                    <label class="field">Host password
                        <input id="hostPassword" type="password" autocomplete="current-password">
                    </label>
                    <div class="row">
                        <label class="field">Map <select id="hostMap"></select></label>
                        <label class="field">Bot skill <select id="hostDifficulty"></select></label>
                    </div>
                    <label class="field">Bots
                        <span class="range"><input id="hostBots" type="range" min="0" max="12" value="0"><output id="hostBotsOut">0</output></span>
                    </label>
                    <button id="apply" class="primary">Apply to server</button>
                    <p id="hostMsg" class="msg" role="status"></p>
                </div>
            </details>
        </section>

        <section id="offline" class="panel" role="tabpanel" hidden>
            <div class="row">
                <label class="field">Map <select id="offMap"></select></label>
                <label class="field">Bot skill <select id="offDifficulty"></select></label>
            </div>
            <label class="field">Bots
                <span class="range"><input id="offBots" type="range" min="0" max="12" value="6"><output id="offBotsOut">6</output></span>
            </label>
            <button id="playOffline" class="primary">Play offline</button>
            <p class="msg">Runs entirely in your browser. No port forwarding needed.</p>
        </section>
    </div>

    <div class="data">
        <span id="dataText">Downloading game files…</span>
        <div class="bar"><i id="dataBar"></i></div>
    </div>

    <footer>
        <label><input type="checkbox" id="touchControls"> Touch controls</label>
        <span>Controller: plug it in and press any button once the game starts.</span>
    </footer>
</main>

<div id="game">
    <div id="logo">JOUCS</div>
    <canvas id="canvas"></canvas>
    <p id="warning">If it's not starting, try to enable microphone and refresh</p>
</div>
</body>
</html>
